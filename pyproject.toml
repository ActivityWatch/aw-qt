[tool.poetry]
name = "aw-qt"
version = "0.1.0"
description = "Trayicon for ActivityWatch"
authors = ["Erik Bjäreholt <erik@bjareho.lt>"]
license = "MPL-2.0"
include = ["aw_qt/resources.py"]  # resources.py is in .gitignore and generated before build
packages = [
    { include = "aw_qt" },
]

[tool.poetry.scripts]
aw-qt = "aw_qt:main"

[tool.poetry.dependencies]
python = ">=3.9,<3.14"  # PyInstaller needs <3.14; PyQt6 >=6.8 needs >=3.9
aw-core = "^0.5.18"

pyobjc-framework-Cocoa = { version = "*", platform = "darwin" }
click = "*"

# For some reason, importlib-metadata is being uninstalled in the bundle repo CI
# (despite needed by flask in aw-server for Python <3.10)
importlib-metadata = {version = "*", python = "<3.10"}

# provides pkg_resources, needed for pyinstaller for some reason
setuptools = "*"

[tool.poetry.group.pyqt.dependencies]
# Keep these in sync. Qt 6.10 fixes the macOS 26/27 tray crash; retain 6.5.3
# elsewhere so Linux wheels still support glibc 2.28 instead of requiring 2.34.
PyQt6 = [
    { version = "6.10.2", markers = "sys_platform == 'darwin'" },
    { version = "6.5.3", markers = "sys_platform != 'darwin'" },
]
PyQt6-Qt6 = [
    { version = "6.10.2", markers = "sys_platform == 'darwin'" },
    { version = "6.5.3", markers = "sys_platform != 'darwin'" },
]

[tool.poetry.dev-dependencies]
mypy = "*"
PyQt6-stubs = { git = "https://github.com/TilmanK/PyQt6-stubs", rev = "main" }
flake8 = "*"
pyinstaller = ">=6.6"
types-click = "*"

[tool.mypy]
python_version = 3.8
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "*.resources"
ignore_errors = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
